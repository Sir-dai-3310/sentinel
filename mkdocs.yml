site_name: Sentinel Documentation
site_description: AI-native Security Operations Center (SOC) platform
site_url: https://yourusername.github.io/sentinel/
repo_url: https://github.com/yourusername/sentinel
repo_name: yourusername/sentinel
docs_dir: docs

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.highlight
    - search.suggest

extra:
  version:
    provider: mike
    default: latest

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [sentinel-agents]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: quickstart.md
      - Architecture: architecture.md
      - Performance: performance.md
  - Reference:
      - REST API: api.md
      - Python API Reference: api-reference.md
  - Guides:
      - Multi-Tenancy: multi-tenancy.md
      - Plugin Development: plugins.md
      - Plugin Marketplace: plugin-marketplace.md
      - Security: security.md
  - Community:
      - Contributing: contributing.md
      - Translations: translations.md
      - Labels: labels.md
  - Enterprise & Sustainability:
      - Enterprise: enterprise.md
      - License Rationale: license-rationale.md
      - Whitepaper: whitepaper.md
  - Architecture Decisions:
      - ADR-001 Rust Core: adr/001-rust-core.md
      - ADR-002 LangGraph Orchestration: adr/002-langgraph-orchestration.md
      - ADR-003 PostgreSQL Persistence: adr/003-postgresql-persistence.md
      - ADR-004 Multi-Tenancy: adr/004-multi-tenancy.md
      - ADR-005 Kafka Streaming: adr/005-kafka-streaming.md
      - ADR-006 LLM Provider Abstraction: adr/006-llm-provider-abstraction.md
