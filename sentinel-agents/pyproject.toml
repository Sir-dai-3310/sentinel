[tool.poetry]
name = "sentinel-agents"
version = "1.2.0"
description = "AI-powered security analysis agents for Sentinel"
authors = ["Sentinel Team"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
langgraph = "^1.2"
langchain = "^1.3"
langchain-openai = "^1.5"
openai = "^3.1"
pydantic = "^2.13"
httpx = "^0.28"
tenacity = "^9.1"
python-dotenv = "^1.0"
pyyaml = "^6.0.2"
reportlab = "^5.0"
aiokafka = "^0.14"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.3,<10.0.0"
pytest-asyncio = "^0.21.1"
black = "^23.12.0"
ruff = "^0.1.8"
mypy = "^1.7.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
