title: Clipboard Data Collection
id: R016
status: stable
description: Detects clipboard data access attempts
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'Get-Clipboard'
      - 'clip.exe'
  condition: selection
falsepositives:
  - Legitimate clipboard usage
level: medium
tags:
  - attack.collection
  - attack.t1115
references:
  - https://attack.mitre.org/techniques/T1115/
