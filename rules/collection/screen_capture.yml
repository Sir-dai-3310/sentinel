title: Screen Capture
id: R071
status: stable
description: Detects screen capture activity
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'CopyFromScreen'
      - 'BitBlt'
      - 'screenshot'
  condition: selection
falsepositives:
  - Administrative activity
level: medium
tags:
  - attack.collection
  - attack.t1113
