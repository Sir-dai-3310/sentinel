title: Browser Credential Theft
id: R074
status: stable
description: Detects access to browser credential stores
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'Login Data'
      - 'Web Data'
      - 'Cookies'
  condition: selection
falsepositives:
  - Administrative activity
level: high
tags:
  - attack.collection
  - attack.t1552.001
