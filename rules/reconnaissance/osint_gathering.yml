title: OSINT Gathering
id: R113
status: stable
description: Detects OSINT gathering tools
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'theHarvester'
      - 'recon-ng'
      - 'maltego'
  condition: selection
falsepositives:
  - Legitimate administrative activity
level: medium
tags:
  - attack.reconnaissance
  - attack.t1593
