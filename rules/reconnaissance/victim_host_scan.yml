title: Victim Host Scanning
id: R112
status: stable
description: Detects host discovery scans
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'ping -t'
      - 'arp -a'
      - 'Test-Connection'
  condition: selection
falsepositives:
  - Legitimate administrative activity
level: low
tags:
  - attack.reconnaissance
  - attack.t1595.001
