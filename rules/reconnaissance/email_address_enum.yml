title: Email Address Enumeration
id: R114
status: stable
description: Detects email enumeration
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'Get-Recipient'
      - 'Get-Mailbox'
      - 'Get-DistributionGroup'
  condition: selection
falsepositives:
  - Legitimate administrative activity
level: medium
tags:
  - attack.reconnaissance
  - attack.t1589.002
