title: Password Policy Enumeration
id: R117
status: stable
description: Detects password policy discovery
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'net accounts'
      - 'Get-ADDefaultDomainPasswordPolicy'
  condition: selection
falsepositives:
  - Legitimate administrative activity
level: low
tags:
  - attack.reconnaissance
  - attack.t1201
