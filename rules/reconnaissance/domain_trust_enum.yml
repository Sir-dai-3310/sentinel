title: Domain Trust Enumeration
id: R115
status: stable
description: Detects domain trust discovery
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'nltest /domain_trusts'
      - 'Get-ADDomain'
      - 'Get-DomainTrust'
  condition: selection
falsepositives:
  - Legitimate administrative activity
level: medium
tags:
  - attack.reconnaissance
  - attack.t1482
