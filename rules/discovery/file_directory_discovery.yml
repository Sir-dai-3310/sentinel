title: File and Directory Discovery
id: R063
status: stable
description: Detects mass file enumeration
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'dir /s'
      - 'Get-ChildItem -Recurse'
      - 'tree /f'
  condition: selection
falsepositives:
  - Administrative activity
level: low
tags:
  - attack.discovery
  - attack.t1083
