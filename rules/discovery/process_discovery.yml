title: Suspicious Process Discovery
id: R013
status: stable
description: Detects suspicious process enumeration commands
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'tasklist'
      - 'Get-Process'
      - 'ps aux'
      - 'wmic process'
  condition: selection
falsepositives:
  - Legitimate system administration
  - Monitoring tools
level: low
tags:
  - attack.discovery
  - attack.t1057
references:
  - https://attack.mitre.org/techniques/T1057/
