title: Security Software Discovery
id: R066
status: stable
description: Detects security software enumeration
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'Get-MpComputerStatus'
      - 'Get-CimInstance'
      - 'AntiVirusProduct'
  condition: selection
falsepositives:
  - Administrative activity
level: medium
tags:
  - attack.discovery
  - attack.t1518.001
