title: Account Discovery
id: R061
status: stable
description: Detects account enumeration commands
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'net user'
      - 'net group'
      - 'Get-LocalUser'
  condition: selection
falsepositives:
  - Administrative activity
level: low
tags:
  - attack.discovery
  - attack.t1087
