title: System Information Discovery
id: R062
status: stable
description: Detects system information gathering
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'systeminfo'
      - 'Get-ComputerInfo'
      - 'hostname'
  condition: selection
falsepositives:
  - Administrative activity
level: low
tags:
  - attack.discovery
  - attack.t1082
