title: Service Permission Weakness
id: R035
status: stable
description: Detects modification of service binaries
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'sc config'
      - 'binpath='
  condition: selection
falsepositives:
  - Administrative activity
level: high
tags:
  - attack.privilege_escalation
  - attack.t1574.010
