title: DLL Search Order Hijacking
id: R036
status: stable
description: Detects DLL search order hijacking attempts
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'rundll32.exe'
      - '.dll,'
  condition: selection
falsepositives:
  - Administrative activity
level: medium
tags:
  - attack.privilege_escalation
  - attack.t1574.001
