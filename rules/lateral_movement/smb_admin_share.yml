title: SMB Admin Share Access
id: R008
status: stable
description: Detects access to SMB admin shares (lateral movement)
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'net use'
      - '\\admin$'
      - '\\c$'
      - 'psexec'
  condition: selection
falsepositives:
  - Legitimate network administration
  - IT management tools
level: high
tags:
  - attack.lateral_movement
  - attack.t1021.002
references:
  - https://attack.mitre.org/techniques/T1021/002/
