title: Data Compressed for Exfiltration
id: R017
status: stable
description: Detects data compression before exfiltration
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'Compress-Archive'
      - 'tar -czf'
      - 'zip -r'
      - '7z a'
  condition: selection
falsepositives:
  - Legitimate backup operations
  - Software packaging
level: medium
tags:
  - attack.exfiltration
  - attack.t1560.001
references:
  - https://attack.mitre.org/techniques/T1560/001/
