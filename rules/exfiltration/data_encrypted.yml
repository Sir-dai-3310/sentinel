title: Data Encrypted for Exfiltration
id: R018
status: stable
description: Detects data encryption before exfiltration
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'openssl enc'
      - 'gpg -c'
      - 'ConvertTo-SecureString'
  condition: selection
falsepositives:
  - Legitimate encryption operations
level: high
tags:
  - attack.exfiltration
  - attack.t1560.002
references:
  - https://attack.mitre.org/techniques/T1560/002/
