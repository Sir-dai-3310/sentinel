title: Exfiltration Over DNS
id: R093
status: stable
description: Detects DNS-based data exfiltration
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'nslookup'
      - 'Resolve-DnsName'
      - '.onion'
  condition: selection
falsepositives:
  - Administrative activity
level: high
tags:
  - attack.exfiltration
  - attack.t1048
