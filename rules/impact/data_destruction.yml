title: Data Destruction
id: R020
status: stable
description: Detects attempts to destroy data
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'del /f /s /q'
      - 'Remove-Item -Recurse -Force'
      - 'rm -rf'
  condition: selection
falsepositives:
  - Legitimate file cleanup
level: critical
tags:
  - attack.impact
  - attack.t1485
references:
  - https://attack.mitre.org/techniques/T1485/
