title: Ransomware Shadow Copy Deletion
id: R095
status: stable
description: Detects shadow copy deletion (ransomware indicator)
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'vssadmin delete shadows'
      - 'vssadmin Delete Shadows'
  condition: selection
falsepositives:
  - Administrative activity
level: critical
tags:
  - attack.impact
  - attack.t1490
