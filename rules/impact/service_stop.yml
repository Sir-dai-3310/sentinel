title: Service Stop
id: R019
status: stable
description: Detects attempts to stop critical services
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'net stop'
      - 'Stop-Service'
      - 'sc stop'
  filter:
    CommandLine|contains:
      - 'eventlog'
      - 'windefend'
      - 'wuauserv'
  condition: selection and filter
falsepositives:
  - Legitimate service management
level: high
tags:
  - attack.impact
  - attack.t1489
references:
  - https://attack.mitre.org/techniques/T1489/
