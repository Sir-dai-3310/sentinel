title: Suspicious Rundll32 Execution
id: R010
status: stable
description: Detects suspicious rundll32 execution with non-standard DLL paths
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: 'rundll32.exe'
  filter:
    CommandLine|contains:
      - 'shell32.dll'
      - 'sysdm.cpl'
      - 'devmgr.dll'
  condition: selection and not filter
falsepositives:
  - Legitimate system administration
level: high
tags:
  - attack.defense_evasion
  - attack.t1218.011
references:
  - https://attack.mitre.org/techniques/T1218/011/
