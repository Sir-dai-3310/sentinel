title: Process Hollowing
id: R056
status: stable
description: Detects process hollowing indicators
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'CreateProcess'
      - 'CREATE_SUSPENDED'
  condition: selection
falsepositives:
  - Administrative activity
level: critical
tags:
  - attack.defense_evasion
  - attack.t1055.012
