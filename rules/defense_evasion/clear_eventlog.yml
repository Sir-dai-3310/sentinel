title: Clear Windows Event Logs
id: R009
status: stable
description: Detects attempts to clear Windows event logs (defense evasion)
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection_cmd:
    CommandLine|contains:
      - 'wevtutil cl'
      - 'Clear-EventLog'
  selection_event:
    EventID:
      - '1102'
      - '104'
  condition: selection_cmd or selection_event
falsepositives:
  - Legitimate log management
  - System maintenance scripts
level: critical
tags:
  - attack.defense_evasion
  - attack.t1070.001
references:
  - https://attack.mitre.org/techniques/T1070/001/
