title: Scheduled Task Creation
id: R007
status: stable
description: Detects creation of scheduled tasks (persistence mechanism)
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'schtasks'
      - '/create'
  condition: selection
falsepositives:
  - Legitimate task scheduling
  - Software installation
level: medium
tags:
  - attack.persistence
  - attack.t1053.005
references:
  - https://attack.mitre.org/techniques/T1053/005/
