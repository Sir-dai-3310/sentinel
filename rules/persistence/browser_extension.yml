title: Malicious Browser Extension
id: R110
status: stable
description: Detects browser extension installation
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    TargetObject|contains:
      - 'Extensions'
      - 'chrome'
      - 'edge'
  condition: selection
falsepositives:
  - Administrative activity
level: medium
tags:
  - attack.persistence
  - attack.t1176
