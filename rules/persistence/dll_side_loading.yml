title: DLL Side-Loading
id: R109
status: stable
description: Detects DLL side-loading persistence
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '.exe'
    CommandLine|contains:
      - '.dll'
  condition: selection
falsepositives:
  - Administrative activity
level: medium
tags:
  - attack.persistence
  - attack.t1574.002
