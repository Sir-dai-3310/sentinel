title: Startup Folder Persistence
id: R108
status: stable
description: Detects file creation in startup folder
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    TargetFilename|contains:
      - '\\Startup\\'
      - '\\Start Menu\\Programs\\Startup'
  condition: selection
falsepositives:
  - Administrative activity
level: medium
tags:
  - attack.persistence
  - attack.t1547.001
