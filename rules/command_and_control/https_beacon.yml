title: HTTPS Beacon
id: R082
status: stable
description: Detects HTTPS beaconing patterns
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    EventID: '3'
    DestinationPort: '443'
    Image|endswith:
      - 'powershell.exe'
      - 'rundll32.exe'
  condition: selection
falsepositives:
  - Administrative activity
level: medium
tags:
  - attack.command_and_control
  - attack.t1071.001
