title: WebSocket C2
id: R084
status: stable
description: Detects WebSocket-based C2 communication
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'ws://'
      - 'wss://'
  condition: selection
falsepositives:
  - Administrative activity
level: medium
tags:
  - attack.command_and_control
  - attack.t1071.001
