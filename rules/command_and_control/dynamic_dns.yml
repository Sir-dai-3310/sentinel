title: Dynamic DNS Usage
id: R083
status: stable
description: Detects connections to dynamic DNS providers
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'no-ip.com'
      - 'duckdns.org'
      - 'ddns.net'
  condition: selection
falsepositives:
  - Administrative activity
level: medium
tags:
  - attack.command_and_control
  - attack.t1071.001
