title: DNS Tunneling
id: R081
status: stable
description: Detects potential DNS tunneling
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'nslookup'
      - '-type=TXT'
      - 'Resolve-DnsName'
  condition: selection
falsepositives:
  - Administrative activity
level: high
tags:
  - attack.command_and_control
  - attack.t1071.004
