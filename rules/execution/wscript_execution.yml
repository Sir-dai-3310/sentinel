title: WScript Execution
id: R103
status: stable
description: Detects suspicious WScript/CScript execution
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
      - 'wscript.exe'
      - 'cscript.exe'
    CommandLine|contains:
      - '.js'
      - '.vbs'
  condition: selection
falsepositives:
  - Administrative activity
level: medium
tags:
  - attack.execution
  - attack.t1059.005
