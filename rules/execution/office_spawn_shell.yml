title: Office Application Spawning Shell
id: R002
status: stable
description: Detects Office applications spawning command shells (macro attack)
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith:
      - 'winword.exe'
      - 'excel.exe'
      - 'powerpnt.exe'
      - 'outlook.exe'
    Image|endswith:
      - 'powershell.exe'
      - 'cmd.exe'
      - 'wscript.exe'
      - 'cscript.exe'
      - 'mshta.exe'
  condition: selection
falsepositives:
  - Rare legitimate use cases
level: critical
tags:
  - attack.execution
  - attack.t1059.003
references:
  - https://attack.mitre.org/techniques/T1059/003/
