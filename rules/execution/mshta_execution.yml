title: MSHTA Execution
id: R104
status: stable
description: Detects suspicious MSHTA execution
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: 'mshta.exe'
    CommandLine|contains:
      - 'http'
      - 'javascript'
      - 'vbscript'
  condition: selection
falsepositives:
  - Administrative activity
level: high
tags:
  - attack.execution
  - attack.t1059.007
