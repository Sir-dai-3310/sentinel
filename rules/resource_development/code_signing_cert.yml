title: Code Signing Certificate Theft
id: R121
status: stable
description: Detects code signing certificate access
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    TargetObject|contains:
      - '\\CurrentVersion\\My'
      - 'Certificate'
  condition: selection
falsepositives:
  - Legitimate administrative activity
level: high
tags:
  - attack.resource_development
  - attack.t1587.002
