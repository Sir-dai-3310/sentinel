title: Drive Creation for Payloads
id: R124
status: stable
description: Detects drive creation for staging
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'New-PSDrive'
      - 'net use'
      - 'subst'
  condition: selection
falsepositives:
  - Legitimate administrative activity
level: low
tags:
  - attack.resource_development
  - attack.t1580
