title: AS-REP Roasting
id: R026
status: stable
description: Detects AS-REP roasting attacks
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'Rubeus.exe asreproast'
      - 'GetNPUsers'
  condition: selection
falsepositives:
  - Administrative activity
level: high
tags:
  - attack.credential_access
  - attack.t1558.004
