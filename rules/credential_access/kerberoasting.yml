title: Kerberoasting Attack
id: R025
status: stable
description: Detects Kerberoasting via service ticket requests
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'Rubeus.exe kerberoast'
      - 'GetUserSPNs'
  condition: selection
falsepositives:
  - Administrative activity
level: high
tags:
  - attack.credential_access
  - attack.t1558.003
