title: Shadow Copy Access
id: R022
status: stable
description: Detects access to volume shadow copies for credential theft
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'vssadmin'
      - 'shadowcopy'
  condition: selection
falsepositives:
  - Administrative activity
level: high
tags:
  - attack.credential_access
  - attack.t1003
