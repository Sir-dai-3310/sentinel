title: Mimikatz Command Line
id: R011
status: stable
description: Detects Mimikatz credential dumping tool via command line patterns
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'sekurlsa::'
      - 'lsad::dump'
      - 'mimikatz'
      - 'logonpasswords'
  condition: selection
falsepositives:
  - Security research
  - Penetration testing
level: critical
tags:
  - attack.credential_access
  - attack.t1003
references:
  - https://attack.mitre.org/techniques/T1003/
