title: Drive-by Compromise
id: R043
status: stable
description: Detects browser spawning suspicious processes
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith:
      - 'chrome.exe'
      - 'firefox.exe'
      - 'msedge.exe'
    Image|endswith:
      - 'powershell.exe'
      - 'cmd.exe'
  condition: selection
falsepositives:
  - Administrative activity
level: high
tags:
  - attack.initial_access
  - attack.t1189
