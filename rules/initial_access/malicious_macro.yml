title: Malicious Macro Execution
id: R042
status: stable
description: Detects Office macro execution with auto-run
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith:
      - 'winword.exe'
      - 'excel.exe'
    Image|endswith:
      - 'powershell.exe'
      - 'cmd.exe'
  condition: selection
falsepositives:
  - Administrative activity
level: critical
tags:
  - attack.initial_access
  - attack.t1566.001
