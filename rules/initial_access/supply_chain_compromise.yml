title: Supply Chain Indicator
id: R046
status: stable
description: Detects execution of recently modified signed binaries
author: Sentinel Community
date: 2026/08/17
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'rundll32.exe'
      - 'url.dll'
  condition: selection
falsepositives:
  - Administrative activity
level: medium
tags:
  - attack.initial_access
  - attack.t1195
