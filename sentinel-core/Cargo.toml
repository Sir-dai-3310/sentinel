[package]
name = "sentinel-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sentinel_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.193", features = ["derive"] }
serde_json = "=1.0.108"
serde_yaml = "=0.9.27"
regex = "=1.10.2"
regex-automata = "=0.4.18"
rayon = "=1.7.0"
tokio = { version = "=1.35.0", features = ["full"] }
anyhow = "=1.0.75"
thiserror = "=1.0.50"
parking_lot = "=0.12.1"
dashmap = "=5.5.0"
aho-corasick = "=1.1.5"
walkdir = "=2.4.0"
quick-xml = { version = "=0.30.0", features = ["serialize"] }
indexmap = "=2.1.0"
once_cell = "=1.19.0"

[dev-dependencies]
criterion = { version = "=0.4.0", features = ["html_reports"] }
tempfile = "=3.8.0"

[[bench]]
name = "engine_bench"
harness = false
