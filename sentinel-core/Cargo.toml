[package]
name = "sentinel-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sentinel_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
serde_yaml = "=0.9.34"
regex = "=1.11.1"
regex-automata = "=0.4.18"
rayon = "=1.10.0"
tokio = { version = "=1.44.2", features = ["full"] }
anyhow = "=1.0.98"
thiserror = "=1.0.69"
parking_lot = "=0.12.3"
dashmap = "=5.5.0"
aho-corasick = "=1.1.5"
walkdir = "=2.5.0"
quick-xml = { version = "=0.41.0", features = ["serialize"] }  # RUSTSEC-2026-0194/0195 已修复(>=0.41, 需 rustc>=1.79)，工具链已升至 1.91，见 docs/security/dependency-audit.md
indexmap = "=2.2.1"
once_cell = "=1.20.2"
pyo3 = { version = "=0.22.6", features = ["extension-module", "abi3-py311"], optional = true }

[features]
# Enable the Python (PyO3) bindings. Built via maturin for the sentinel_agents
# package so the Rust Sigma engine can be called from Python.
pyo3 = ["dep:pyo3"]

[dev-dependencies]
criterion = { version = "=0.4.0", features = ["html_reports"] }
tempfile = "=3.8.0"

[[bench]]
name = "engine_bench"
harness = false
