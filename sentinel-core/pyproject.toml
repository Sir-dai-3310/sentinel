[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "sentinel-core"
version = "1.2.0"
description = "High-performance Rust Sigma detection engine with Python (PyO3) bindings"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
# Build the cdylib with the pyo3 feature so `import sentinel_core` works.
features = ["pyo3"]
module-name = "sentinel_core"
