[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-sdk"
version = "1.2.0"
description = "Async Python SDK for the Sentinel security log analysis API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Sentinel Project" }]
keywords = ["security", "siem", "log-analysis", "sigma"]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/sentinel-project/sentinel"
Documentation = "https://github.com/sentinel-project/sentinel/tree/main/docs/sdks"

[tool.hatch.build.targets.wheel]
packages = ["sentinel_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
