# Default values for sentinel.

replicaCount: 2

image:
  api:
    repository: sentinel/api
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  web:
    repository: sentinel/web
    tag: "1.0.0"
    pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  api:
    type: ClusterIP
    port: 8000
  web:
    type: ClusterIP
    port: 80

# External PostgreSQL (managed outside this chart). Credentials come from an
# existing Kubernetes Secret — never put plaintext passwords in values.
postgresql:
  host: "postgres.example.svc.cluster.local"
  port: 5432
  database: sentinel
  user: sentinel
  existingSecret: "sentinel-postgres"
  # Key inside the secret holding the password
  secretKeys:
    password: "password"

redis:
  host: "redis.example.svc.cluster.local"
  port: 6379
  existingSecret: "sentinel-redis"
  secretKeys:
    password: "password"

# Non-secret application configuration (rendered into a ConfigMap)
config:
  corsOrigins: "http://localhost:3000"
  agentsGrpcUrl: "sentinel-agents:50052"
  rustLog: "info"

# Placeholder app secrets rendered from values only when create=true.
# Prefer existingSecret for real deployments.
secrets:
  create: false
  # Keys must be provided via --set-file or an external secret manager.
  data: {}

resources:
  api:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  web:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 80

ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: sentinel.example.com
  tls: []

web:
  enabled: true
  replicaCount: 2

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    path: /metrics

podAnnotations: {}
podSecurityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
