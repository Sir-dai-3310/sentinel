# Default values for sentinel.

replicaCount:
  api: 2
  web: 2

image:
  api:
    repository: sentinel/api
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  web:
    repository: sentinel/web
    tag: "1.0.0"
    pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  api:
    type: ClusterIP
    port: 8000
  web:
    type: ClusterIP
    port: 80

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  host: sentinel.local
  tls: []

resources:
  api:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  web:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# --- External dependencies (PostgreSQL / Redis) ---
# 默认指向集群外部/独立部署的服务；凭据一律通过 existingSecret 引用，
# 本文件不包含任何明文密码。
postgres:
  host: postgres.example.internal
  port: 5432
  database: sentinel
  user: sentinel

redis:
  host: redis.example.internal
  port: 6379

secrets:
  # 推荐：提前创建好包含以下 key 的 Secret，并把名字填到这里。
  #   DATABASE_URL  例如 postgresql://<user>:<password>@<host>:5432/<db>
  #   REDIS_URL     例如 redis://:<password>@<host>:6379/0
  existingSecret: ""
  # 占位模式：existingSecret 为空时，chart 会用下面的值渲染一个占位 Secret。
  # 默认留空，部署前必须通过 --set 或外部秘管系统注入，切勿提交真实口令。
  databaseUrl: ""
  redisUrl: ""

# 非敏感环境变量（映射到 ConfigMap）
env:
  CORS_ORIGINS: "http://localhost:3000"
  AGENTS_GRPC_URL: "agents:50052"
  RUST_LOG: "info"

nodeSelector: {}
tolerations: []
affinity: {}

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    path: /metrics
