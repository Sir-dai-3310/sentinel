# Default values for the Sentinel chart.

replicaCount: 2

image:
  api:
    repository: sentinel/api
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  web:
    repository: sentinel/web
    tag: "1.0.0"
    pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# --- API (FastAPI backend, port 8000) ---
api:
  service:
    type: ClusterIP
    port: 8000
  env:
    # Non-sensitive configuration; rendered into the ConfigMap.
    AGENTS_GRPC_URL: "sentinel-agents:50052"
    CORS_ORIGINS: "http://localhost:3000"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

# --- Web (React static bundle served by nginx, port 80) ---
web:
  enabled: true
  replicaCount: 2
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# --- External PostgreSQL (not deployed by this chart) ---
postgresql:
  host: "postgres.example.svc.cluster.local"
  port: 5432
  database: sentinel
  user: sentinel
  # Name of a pre-existing Secret holding credentials.
  # Expected keys: DATABASE_URL (full DSN) and/or POSTGRES_PASSWORD.
  existingSecret: "sentinel-postgres-credentials"
  secretKeys:
    databaseUrl: DATABASE_URL

# --- External Redis (not deployed by this chart) ---
redis:
  host: "redis.example.svc.cluster.local"
  port: 6379
  # Pre-existing Secret; expected key: REDIS_URL (e.g. redis://[:password@]host:6379/0)
  existingSecret: "sentinel-redis-credentials"
  secretKeys:
    redisUrl: REDIS_URL

# Set create=true to have the chart render an (empty) placeholder Secret
# instead of referencing existingSecret above. Never put real credentials here.
secrets:
  create: false

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: sentinel.example.local
  tls: []

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

nodeSelector: {}
tolerations: []
affinity: {}

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    path: /metrics
