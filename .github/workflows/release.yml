name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Generate SBOM
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json

  # Build and push Docker images
  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: sbom
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push api (bundles Rust core + agents in-process)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.api
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ steps.version.outputs.VERSION }}
          provenance: true
          sbom: true

      - name: Build and push web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.web
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ steps.version.outputs.VERSION }}
          provenance: true
          sbom: true

  # Create GitHub Release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [sbom, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom

      - name: Generate changelog
        id: changelog
        run: |
          # Generate release notes into a temp file (do NOT overwrite the
          # repository's CHANGELOG.md, which is maintained by
          # scripts/generate-changelog.py from Conventional Commits).
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            git log --pretty=format:"- %s (%h)" --no-merges > RELEASE_NOTES.md
          else
            git log --pretty=format:"- %s (%h)" --no-merges ${PREV_TAG}..HEAD > RELEASE_NOTES.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            sbom.spdx.json
            sbom.cyclonedx.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
