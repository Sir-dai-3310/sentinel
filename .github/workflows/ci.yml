name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # Rust Core Tests
  rust-core:
    name: Rust Core Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Run benchmarks
        run: cargo bench --no-run

  # Rust MSRV Check (minimum supported rust version, aligned with README badge)
  rust-msrv:
    name: Rust MSRV (1.79)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.79
        uses: dtolnay/rust-toolchain@1.79.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (MSRV)
        run: cargo build --all-features

  # Python Agents Tests
  python-agents:
    name: Python Agents Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        working-directory: ./sentinel-agents
        run: poetry install

      - name: Build & install Rust core (PyO3) so the Rust engine path is tested
        working-directory: ./sentinel-core
        run: |
          pipx install maturin
          poetry -C ../sentinel-agents run maturin develop --features pyo3 -m ./Cargo.toml

      - name: Lint (ruff)
        working-directory: ./sentinel-agents
        run: poetry run ruff check .

      - name: Type check (mypy)
        working-directory: ./sentinel-agents
        run: poetry run mypy sentinel_agents

      - name: Run tests
        working-directory: ./sentinel-agents
        run: poetry run pytest --cov=sentinel_agents --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./sentinel-agents/coverage.xml
          flags: agents

  # API Tests
  api:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        working-directory: ./sentinel-api
        run: poetry install

      - name: Install agents library (imported in-process by the API)
        working-directory: ./sentinel-api
        run: poetry run pip install ../sentinel-agents

      - name: Lint (ruff)
        working-directory: ./sentinel-api
        run: poetry run ruff check .

      - name: Type check (mypy)
        working-directory: ./sentinel-api
        run: poetry run mypy --explicit-package-bases app

      - name: Run tests
        working-directory: ./sentinel-api
        run: poetry run pytest --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./sentinel-api/coverage.xml
          flags: api

  # Python SDK Tests
  sdk:
    name: Python SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ./sdk
        run: pip install -e ".[test]"

      - name: Run tests
        working-directory: ./sdk
        run: pytest --cov=sentinel_sdk --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./sdk/coverage.xml
          flags: sdk

  # Web UI Tests
  web:
    name: Web UI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ./sentinel-web
        run: npm ci

      - name: Lint
        working-directory: ./sentinel-web
        run: npm run lint

      - name: Type check
        working-directory: ./sentinel-web
        run: npm run type-check

      - name: Run tests
        working-directory: ./sentinel-web
        run: npm run test:ci

      - name: Build
        working-directory: ./sentinel-web
        run: npm run build

  # Secret Scanning (gitleaks, config in .gitleaks.toml)
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  # Docker Build
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [rust-core, python-agents, api, web, secret-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api (bundles Rust core + agents in-process)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.api
          push: false
          tags: sentinel/api:latest

      - name: Build web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.web
          push: false
          tags: sentinel/web:latest
