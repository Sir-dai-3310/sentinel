name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # Rust Core Tests
  rust-core:
    name: Rust Core Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Run benchmarks
        run: cargo bench --no-run

  # Python Agents Tests
  python-agents:
    name: Python Agents Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        working-directory: ./sentinel-agents
        run: poetry install

      - name: Lint (ruff)
        working-directory: ./sentinel-agents
        run: poetry run ruff check .

      - name: Type check (mypy)
        working-directory: ./sentinel-agents
        run: poetry run mypy sentinel_agents

      - name: Run tests
        working-directory: ./sentinel-agents
        run: poetry run pytest --cov=sentinel_agents --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./sentinel-agents/coverage.xml
          flags: agents

  # API Tests
  api:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ./sentinel-api
        run: |
          pip install fastapi[all] pytest pytest-asyncio httpx

      - name: Run tests
        working-directory: ./sentinel-api
        run: pytest --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./sentinel-api/coverage.xml
          flags: api

  # Web UI Tests
  web:
    name: Web UI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ./sentinel-web
        run: npm ci

      - name: Lint
        working-directory: ./sentinel-web
        run: npm run lint

      - name: Type check
        working-directory: ./sentinel-web
        run: npm run type-check

      - name: Run tests
        working-directory: ./sentinel-web
        run: npm run test:ci

      - name: Build
        working-directory: ./sentinel-web
        run: npm run build

  # Docker Build
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [rust-core, python-agents, api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build core
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.core
          push: false
          tags: sentinel/core:latest

      - name: Build agents
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.agents
          push: false
          tags: sentinel/agents:latest

      - name: Build api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.api
          push: false
          tags: sentinel/api:latest

      - name: Build web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.web
          push: false
          tags: sentinel/web:latest
