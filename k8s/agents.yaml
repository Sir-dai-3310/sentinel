# OPTIONAL: standalone Kafka streaming consumer.
# The agents library normally runs in-process inside the api Deployment; this
# manifest is only for high-throughput streaming ingestion and is NOT included
# in the base kustomization. Requires a Kafka broker to be reachable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-agents
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel-agents
    app.kubernetes.io/component: agents
    app.kubernetes.io/part-of: sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel-agents
      app.kubernetes.io/component: agents
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-agents
        app.kubernetes.io/component: agents
        app.kubernetes.io/part-of: sentinel
    spec:
      containers:
        - name: agents
          # Runs `python -m sentinel_agents.streaming` (Kafka consumer).
          image: sentinel/agents:1.2.0
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: sentinel-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sentinel-credentials
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sentinel-credentials
                  key: REDIS_URL
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinel-credentials
                  key: LLM_API_KEY
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "sentinel-kafka:9092"
            - name: KAFKA_INPUT_TOPIC
              value: "sentinel-logs"
            - name: KAFKA_OUTPUT_TOPIC
              value: "sentinel-alerts"
          # No network listener: liveness verifies the consumer process is alive.
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import sys; sys.exit(0)"
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
