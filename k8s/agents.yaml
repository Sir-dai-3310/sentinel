apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-agents
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel-agents
    app.kubernetes.io/component: agents
    app.kubernetes.io/part-of: sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel-agents
      app.kubernetes.io/component: agents
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-agents
        app.kubernetes.io/component: agents
        app.kubernetes.io/part-of: sentinel
    spec:
      containers:
        - name: agents
          image: sentinel/agents:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50052
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sentinel-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sentinel-credentials
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sentinel-credentials
                  key: REDIS_URL
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinel-credentials
                  key: LLM_API_KEY
            # Kafka streaming consumer (optional; only used when KAFKA_* is set)
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "sentinel-kafka:9092"
            - name: KAFKA_INPUT_TOPIC
              value: "sentinel-logs"
            - name: KAFKA_OUTPUT_TOPIC
              value: "sentinel-alerts"
          # gRPC has no HTTP endpoint: use a TCP socket probe on 50052.
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-agents
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel-agents
    app.kubernetes.io/component: agents
    app.kubernetes.io/part-of: sentinel
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sentinel-agents
    app.kubernetes.io/component: agents
  ports:
    - name: grpc
      port: 50052
      targetPort: grpc
      protocol: TCP
