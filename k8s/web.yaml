apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-web
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: sentinel
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel-web
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: sentinel
    spec:
      containers:
        - name: web
          image: sentinel/web:1.0.0
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          # nginx serves the static bundle on /.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-web
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: sentinel
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sentinel-web
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
