apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All resources live in the `sentinel` namespace (created by namespace.yaml).
namespace: sentinel

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - redis.yaml
  - api.yaml
  - web.yaml
  # agents.yaml is NOT part of the base: the agents library runs in-process
  # inside the api container. Deploy agents.yaml separately only for the
  # optional standalone Kafka streaming consumer (see docker-compose.kafka.yml).

commonLabels:
  app.kubernetes.io/part-of: sentinel
