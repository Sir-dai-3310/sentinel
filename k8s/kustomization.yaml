apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All resources live in the `sentinel` namespace (created by namespace.yaml).
namespace: sentinel

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - redis.yaml
  - api.yaml
  - agents.yaml
  - web.yaml

commonLabels:
  app.kubernetes.io/part-of: sentinel
